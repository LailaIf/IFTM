
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campi's Guide</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            overflow-x: hidden;
        }

        /* CABEÇALHO */

        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #174b75;
        }

        .logo span {
            color: #35a7a0;
        }

        /* ÍCONES LATERAIS */

        .atalhos {
            position: fixed;
            top: 100px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .atalho {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            cursor: pointer;
        }

        .atalho p {
            opacity: 0;
            transform: translateX(10px);
            transition: 0.3s;
            color: #174b75;
            font-weight: bold;
            background: white;
            padding: 9px 13px;
            border-radius: 8px;
            pointer-events: none;
        }

        .atalho:hover p {
            opacity: 1;
            transform: translateX(0);
        }

        .icone {
            width: 52px;
            height: 52px;
            background: #174b75;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .atalho:hover .icone {
            background: #35a7a0;
            transform: scale(1.08);
        }

        /* ÁREA PRINCIPAL */

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
        }

        .titulo {
            color: #174b75;
            margin-bottom: 18px;
            font-size: 22px;
        }

        /* BOTÕES 2D E 3D */

        .visualizacao {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .visualizacao button {
            padding: 9px 25px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #174b75;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .visualizacao button.ativo {
            background: #174b75;
            color: white;
        }

        /* MAPA */

        .area-mapa {
            width: 85%;
            height: 490px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #mapa {
            width: 100%;
            height: 100%;
        }

        #iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* BOTÃO QR CODE */

        .botao-qrcode {
            margin-top: 20px;
            padding: 14px 30px;
            background: #35a7a0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao-qrcode:hover {
            background: #25847f;
            transform: scale(1.04);
        }

        /* CÂMERA */

        #leitor {
            display: none;
            margin-top: 15px;
            width: 320px;
            max-width: 100%;
        }

        #leitor video {
            width: 100%;
            border-radius: 10px;
        }

        #resultado {
            margin-top: 10px;
            color: #174b75;
            font-weight: bold;
            text-align: center;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 768px) {

            header {
                padding: 0 15px;
            }

            .area-mapa {
                width: 100%;
                height: 55vh;
            }

            .atalhos {
                right: 12px;
            }

            .icone {
                width: 45px;
                height: 45px;
            }

            main {
                padding: 20px 10px;
            }

            .titulo {
                font-size: 19px;
            }

        }

    </style>
</head>

        // LEITOR DE QR CODE

        let leitor = null;
        let lendo = false;

        async function abrirCamera() {

            const elemento = document.getElementById("leitor");
            const resultado = document.getElementById("resultado");

            elemento.style.display = "block";

            if (leitor !== null) return;

            resultado.innerText = "";

            leitor = new Html5Qrcode("leitor");

            try {

                await leitor.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },

                    async function(codigo) {

                        if (lendo) return;

                        lendo = true;

                        resultado.innerText =
                            "QR Code identificado: " + codigo;

                        try {

                            await leitor.stop();
                            leitor.clear();

                        } catch (erro) {

                            console.log(erro);

                        }

                        leitor = null;
                        elemento.style.display = "none";
                        lendo = false;

                    },

                    function() {}

                );

            } catch (erro) {

                resultado.innerText =
                    "Não foi possível acessar a câmera.";

                console.log(erro);

                if (leitor !== null) {
                    leitor = null;
                }

                elemento.style.display = "none";

            }

        }

    </script>
